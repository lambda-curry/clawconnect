<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --cc-bg: var(--color-background-primary, #ffffff);
    --cc-bg-subtle: var(--color-background-secondary, #f7f7f8);
    --cc-fg: var(--color-text-primary, #111111);
    --cc-fg-muted: var(--color-text-secondary, #666666);
    --cc-border: var(--color-border-primary, #e2e2e2);
    /* Actions stay neutral so the widget blends into the host surface.
       Status colors are reserved for status pills/dots and paired with
       visible icons + labels, never used as general-purpose accents. */
    --cc-action-bg: #f1f1f1;
    --cc-action-hover: #e7e7e7;
    --cc-action-selected: #e4e4e4;
    --cc-action-fg: #252525;
    --cc-active: #9a7b45;
    --cc-needs-attention: #9a6b4a;
    --cc-completed: #63856d;
    --cc-failed: #a56b6b;
  }
  :root[data-theme="dark"] {
    --cc-bg: var(--color-background-primary, #18181b);
    --cc-bg-subtle: var(--color-background-secondary, #232326);
    --cc-fg: var(--color-text-primary, #f4f4f5);
    --cc-fg-muted: var(--color-text-secondary, #a1a1aa);
    --cc-border: var(--color-border-primary, #3f3f46);
    --cc-action-bg: #2b2b2f;
    --cc-action-hover: #35353a;
    --cc-action-selected: #38383d;
    --cc-action-fg: #e4e4e7;
    --cc-active: #c0a06a;
    --cc-needs-attention: #bd8b68;
    --cc-completed: #83aa8c;
    --cc-failed: #c58a8a;
  }
  @media (prefers-color-scheme: dark) {
    /* Only applies before the host has told us its theme via hostContext —
       data-theme (set explicitly, see applyTheme()) always wins over this
       in both directions, per the bug the prior widget shipped. */
    :root:not([data-theme]) {
      --cc-bg: #18181b;
      --cc-bg-subtle: #232326;
      --cc-fg: #f4f4f5;
      --cc-fg-muted: #a1a1aa;
      --cc-border: #3f3f46;
      --cc-action-bg: #2b2b2f;
      --cc-action-hover: #35353a;
      --cc-action-selected: #38383d;
      --cc-action-fg: #e4e4e7;
      --cc-active: #c0a06a;
      --cc-needs-attention: #bd8b68;
      --cc-completed: #83aa8c;
      --cc-failed: #c58a8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--cc-bg);
    color: var(--cc-fg);
  }
  #root { padding: 10px 12px; overflow-x: hidden; }
  .cc-row {
    border: 1px solid var(--cc-border); border-left: 3px solid var(--cc-border); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 8px; cursor: pointer; position: relative;
  }
  .cc-row:last-child { margin-bottom: 0; }
  /* Keep focus visible through structure and neutral contrast, not accent. */
  .cc-row--pinned { border-color: var(--cc-border); border-left-color: var(--cc-border); }
  .cc-row--pinned::before {
    content: none;
  }
  .cc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .cc-title { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cc-pill {
    flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap;
  }
  .cc-pill--active { color: var(--cc-active); }
  .cc-pill--needs_attention { color: var(--cc-needs-attention); }
  .cc-pill--completed { color: var(--cc-completed); }
  .cc-pill--failed { color: var(--cc-failed); }
  .cc-meta { color: var(--cc-fg-muted); font-size: 11.5px; margin-top: 3px; }
  /* One line, always. A long tool invocation used to wrap to two or three and
     the card's height jumped on every poll — each row is a glanceable "still
     alive" signal, not something to read in full. */
  .cc-update { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--cc-border); color: var(--cc-fg-muted); font-size: 11px; overflow: hidden; }
  .cc-update:not(:first-of-type) { margin-top: 3px; padding-top: 0; border-top: none; }
  .cc-update-icon { flex: none; }
  .cc-update-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cc-counts { color: var(--cc-fg-muted); font-size: 11.5px; margin-top: 6px; }
  .cc-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .cc-dot--active { background: var(--cc-active); }
  .cc-dot--needs_attention { background: var(--cc-needs-attention); }
  .cc-dot--completed { background: var(--cc-completed); }
  .cc-dot--failed { background: var(--cc-failed); }
  .cc-history { margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--cc-border); }
  .cc-history-item { font-size: 12px; padding: 3px 0; color: var(--cc-fg-muted); }
  .cc-actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  /* Full-bleed: -14px sides and -12px top cancel .cc-row's 12px 14px padding
     so the strip's background and border reach the card edges. Both negatives
     are only correct because this strip is the card's FIRST child — if it ever
     moves back below the title/meta rows, the top margin must become positive
     or it will overlap them (it did, by exactly 12px, until 9929076). */
  .cc-card-tabs { display: flex; gap: 2px; margin: -12px -14px 10px; padding: 0 12px; border-bottom: 1px solid var(--cc-border); background: var(--cc-bg-subtle); border-radius: 9px 9px 0 0; }
  .cc-card-tab { flex: 0 1 auto; min-width: 0; padding: 6px 10px 5px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--cc-fg-muted); font: inherit; font-size: 11px; cursor: pointer; }
  .cc-card-tab:hover { color: var(--cc-fg); background: var(--cc-action-hover); }
  .cc-card-tab[aria-selected="true"] { border-bottom-color: var(--cc-fg); color: var(--cc-fg); font-weight: 600; }
  .cc-card-tab:focus-visible { outline: 2px solid var(--cc-fg-muted); outline-offset: -2px; }
  .cc-response { margin-top: 8px; font-size: 12.5px; }
  .cc-response.cc-plain, .cc-prompt-body.cc-plain { white-space: pre-wrap; }
  .cc-response h1, .cc-response h2, .cc-response h3, .cc-prompt-body h1, .cc-prompt-body h2, .cc-prompt-body h3 { margin: 10px 0 4px; line-height: 1.25; }
  .cc-response p, .cc-prompt-body p { margin: 5px 0; }
  .cc-response ul, .cc-response ol, .cc-prompt-body ul, .cc-prompt-body ol { margin: 5px 0; padding-left: 20px; }
  .cc-response blockquote, .cc-prompt-body blockquote { margin: 7px 0; padding-left: 10px; border-left: 3px solid var(--cc-border); color: var(--cc-fg-muted); }
  .cc-response code, .cc-prompt-body code { padding: 1px 4px; border-radius: 4px; background: var(--cc-bg-subtle); font: 0.9em ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cc-response pre, .cc-prompt-body pre { margin: 8px 0; padding: 9px 10px; overflow-x: auto; border-radius: 7px; background: #202124; color: #e8eaed; }
  .cc-response pre code, .cc-prompt-body pre code { padding: 0; background: none; color: inherit; }
  .cc-response table, .cc-prompt-body table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
  .cc-response th, .cc-response td, .cc-prompt-body th, .cc-prompt-body td { border: 1px solid var(--cc-border); padding: 4px 7px; text-align: left; }
  .cc-response th, .cc-prompt-body th { background: var(--cc-bg-subtle); font-weight: 600; }
  .cc-response a, .cc-prompt-body a { color: var(--cc-active); text-decoration: underline; }
  .cc-diagnostics { margin-top: 8px; font-size: 12px; white-space: pre-wrap; color: var(--cc-failed); }
  .cc-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; min-height: 28px; }
  .cc-control {
    display: inline-flex; align-items: center; gap: 5px; min-height: 28px;
    padding: 4px 8px; font-size: 11.5px; border-radius: 7px;
  }
  .cc-control-icon { font-size: 14px; line-height: 1; }
  .cc-btn {
    font: inherit; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--cc-border);
    background: transparent; color: var(--cc-fg); cursor: pointer;
  }
  .cc-btn:hover { background: var(--cc-action-hover); border-color: var(--cc-border); }
  .cc-btn:focus-visible { outline: 2px solid var(--cc-fg-muted); outline-offset: 2px; }
  .cc-btn--primary { background: var(--cc-action-bg); border-color: var(--cc-border); color: var(--cc-action-fg); font-weight: 600; }
  .cc-footer { margin-top: 10px; color: var(--cc-fg-muted); font-size: 11px; }
  .cc-prompt { margin-top: 8px; border-radius: 8px; background: var(--cc-bg-subtle); border: 1px solid var(--cc-border); overflow: hidden; }
  .cc-prompt-head {
    display: flex; align-items: center; justify-content: space-between; padding: 6px 10px;
    font-size: 11px; font-weight: 600; color: var(--cc-fg-muted); border-bottom: 1px solid var(--cc-border);
  }
  .cc-prompt-body { padding: 8px 10px; font-size: 12px; }
  .cc-prompt-loading { padding: 10px; color: var(--cc-fg-muted); }
  .cc-prompt-close { background: none; border: none; color: var(--cc-fg-muted); cursor: pointer; font: inherit; padding: 0; }
  .cc-note { color: var(--cc-fg-muted); font-size: 11px; margin-top: 8px; }
  .cc-empty {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--cc-border); border-radius: 9px; background: var(--cc-bg-subtle);
    min-height: 58px;
  }
  .cc-empty-icon { color: var(--cc-fg-muted); font-size: 16px; line-height: 1.35; }
  .cc-empty-title { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .cc-empty-copy { color: var(--cc-fg-muted); font-size: 11.5px; line-height: 1.4; margin-top: 2px; }
  .cc-live-loading { display: inline-block; width: 10px; height: 10px; margin-top: 10px; border: 1.5px solid var(--cc-border); border-top-color: var(--cc-fg-muted); border-radius: 50%; animation: cc-spin .8s linear infinite; }
  @keyframes cc-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root">Loading…</div>
<script>
__STATE_MODULE__

// ── Bridge: window.openai primary (ChatGPT's actual implemented surface),
// a minimal hand-rolled MCP-Apps postMessage fallback for a spec-compliant
// host that doesn't implement window.openai. Read-only/navigation only —
// no ui/message completion, no mutation calls, ever.
const bridge = (() => {
  let mcpAppsRequestId = 0;
  const pending = new Map();

  function viaWindowOpenAI() {
    return typeof window.openai?.callTool === "function" ? window.openai : null;
  }

  function initMcpAppsFallback() {
    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== "object" || msg.id === undefined) return;
      const resolver = pending.get(msg.id);
      if (!resolver) return;
      pending.delete(msg.id);
      if (msg.error) resolver.reject(new Error(msg.error.message || "tool call failed"));
      else resolver.resolve(msg.result);
    });
    // Full ui/initialize -> ui/notifications/initialized handshake, per
    // App.connect() in @modelcontextprotocol/ext-apps@1.5.0 (dist/src/
    // app-bridge.js) — a spec-compliant host won't route ui/message,
    // tools/call, or ui/request-display-mode to this view until it sees
    // this. A real ChatGPT host (window.openai path) never speaks raw
    // postMessage JSON-RPC, so this simply times out there and is ignored —
    // window.openai remains the primary path everywhere else in this file.
    sendMcpAppsRequest("ui/initialize", buildUiInitializeParams(), 5000)
      .then(() => {
        window.parent?.postMessage(buildUiInitializedNotification(), "*");
      })
      .catch(() => {
        // No spec-compliant host answered — nothing to recover, every other
        // fallback call already treats its own timeout as "unsupported".
      });
  }
  initMcpAppsFallback();

  function sendMcpAppsRequest(method, params, timeoutMs) {
    const id = `cc-${++mcpAppsRequestId}`;
    const result = new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      setTimeout(() => {
        if (pending.has(id)) {
          pending.delete(id);
          reject(new Error(`${method} timed out`));
        }
      }, timeoutMs);
    });
    window.parent?.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    return result;
  }

  async function callTool(name, args) {
    const openai = viaWindowOpenAI();
    if (openai) return openai.callTool(name, args);
    return sendMcpAppsRequest("tools/call", { name, arguments: args }, 15000);
  }

  function readMountData() {
    const openai = viaWindowOpenAI();
    const output = openai?.toolOutput ?? null;
    return output?.structuredContent ?? output ?? null;
  }

  /**
   * Fires whenever the mount payload may have become readable.
   *
   * Reading window.openai.toolOutput once at boot is a race: ChatGPT populates
   * its globals asynchronously and announces them with openai:set_globals, so
   * the payload is frequently NOT there when this script first runs. Losing
   * that read is unrecoverable — `mounted` stays null and knownSessionKeys
   * stays empty for the life of the card, so it has no session to poll and
   * renders the "No active tasks" empty state while the task runs fine
   * server-side. Observed live: backend healthy, fresh events recorded, valid
   * session key, and a card that never registered it.
   */
  function onMountData(cb) {
    window.addEventListener("openai:set_globals", () => cb(readMountData()));
    // Standard MCP Apps path: the host pushes the tool result as a
    // notification. initMcpAppsFallback's router only resolves *responses*
    // (it returns early when msg.id is undefined), so notifications need
    // their own listener or the spec-compliant mount path never lands.
    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== "object" || msg.jsonrpc !== "2.0") return;
      if (msg.method !== "ui/notifications/tool-result") return;
      const params = msg.params ?? {};
      cb(params.structuredContent ?? params ?? null);
    });
  }

  function readWidgetState() {
    return viaWindowOpenAI()?.widgetState ?? null;
  }

  function saveWidgetState(value) {
    viaWindowOpenAI()?.setWidgetState?.(value);
  }

  function currentTheme() {
    return viaWindowOpenAI()?.theme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }

  function onThemeChange(cb) {
    window.addEventListener("openai:set_globals", () => cb(currentTheme()));
  }

  return {
    callTool,
    readMountData,
    onMountData,
    readWidgetState,
    saveWidgetState,
    currentTheme,
    onThemeChange,
  };
})();

function applyTheme() {
  document.documentElement.setAttribute("data-theme", bridge.currentTheme());
}
applyTheme();
bridge.onThemeChange(applyTheme);

// ── App state — bridge/DOM glue only. Every decision (grouping, titles,
// view collapse, cadence, dedup) is delegated to the tested pure functions
// imported above; this section never re-implements that logic.
const app = {
  mounted: null,
  // Canonical loaded data: exactly what the last list_tasks read returned,
  // never narrowed in place — compactVisibleTasks() derives what may render.
  tasks: [],
  view: "active",
  allActivity: false,
  compactSessionKey: null, // compact's pinned session — see resolveCompactSelection()
  knownSessionKeys: new Set(),
  pollInFlight: false,
  pollFailures: 0,
  refreshSequence: 0, // monotonic refresh id — only the newest may write, see refresh()
  refreshTimer: null,
  elapsedTicker: null, // local render-only tick, no network — see syncElapsedTicker()
  reconcileRequested: false,
  expanded: new Map(), // sessionKey -> history[] (task summaries) — for the pinned session this is kept fresh automatically every refresh(); for any other row it's fetched once on click
  historyOpen: new Set(), // sessionKeys where the itemized history list should render, vs. just the compact counts line
  promptText: new Map(), // taskId -> preloaded prompt text
  promptLoading: new Set(), // taskId currently mid-fetch — de-dupes a rapid re-select of the Request tab
  // Client-side ring buffer (<=RING_BUFFER_MAX) per taskId — check_task/
  // get_task now return a bounded per-poll delta, not the full log, so the
  // client accumulates recent activity across polls instead of deriving it
  // fresh from one snapshot. eventCursor tracks each task's logCursor so the
  // next poll resumes from exactly where the last one left off.
  recentEvents: new Map(), // taskId -> LogEntry[]
  eventCursor: new Map(), // taskId -> logCursor
  timeline: [], // deriveTimeline(app.recentEvents.get(taskId)) — the actual evidence behind "is working"
  timelineFor: null, // taskId the current timeline belongs to, so a stale fetch never renders under the wrong row
  pinnedDetail: null, // full JobSnapshot (artifacts included) for compact's pinned task — see mergePinnedDetail()
  // Per task, not global: renderRow runs once per card, so a single shared
  // cardTab/cardTabFor pair made the *last* rendered row reset the selection
  // for every other row. With two cards open, tapping "Request" re-rendered,
  // the reset fired, and the tap silently undid itself.
  cardTabByTask: new Map(),
  lastRenderedGroup: null, // status group as of the last render — drives shouldRenderImmediately()
  renderTimer: null, // pending debounced render, for cosmetic-only updates
};

/**
 * Canonical data -> what the compact card may see. Scope is applied as a view
 * over app.tasks, never baked into the stored list.
 */
function compactVisibleTasks() {
  return filterTasksByScope(app.tasks, resolveScope([...app.knownSessionKeys], app.allActivity));
}

/**
 * Register the session this card was mounted for. Idempotent, and safe to call
 * again when a later payload arrives — returns true only when something new was
 * learned, so callers can avoid a pointless re-render.
 *
 * Also seeds compact's pinned session: adopting a mount payload is exactly when
 * the compact card learns what it is about, and resolveCompactSelection's rule 2
 * would pick the same key on the next poll anyway. Seeding here means the very
 * first render after a late mount is already pinned correctly.
 */
function adoptMountData(mountData) {
  if (!mountData?.jobId && !mountData?.taskId) return false;
  const taskId = mountData.taskId ?? mountData.jobId;
  const sessionKey = mountData.sessionKey;
  const isNew = app.mounted?.taskId !== taskId || (sessionKey && !app.knownSessionKeys.has(sessionKey));
  app.mounted = { taskId, sessionKey };
  if (sessionKey) app.knownSessionKeys.add(sessionKey);
  if (sessionKey && !app.compactSessionKey) app.compactSessionKey = sessionKey;
  return isNew;
}

function rehydrate() {
  adoptMountData(bridge.readMountData());
  const saved = bridge.readWidgetState();
  if (saved?.knownSessionKeys) for (const k of saved.knownSessionKeys) app.knownSessionKeys.add(k);
  if (!app.mounted && saved?.mounted) app.mounted = saved.mounted;
  app.compactSessionKey = app.compactSessionKey ?? app.mounted?.sessionKey ?? null;
}

// The mount payload can land after boot (see bridge.onMountData). Without this
// the card never learns its own session and polls nothing.
bridge.onMountData((mountData) => {
  if (!adoptMountData(mountData)) return;
  persist();
  app.reconcileRequested = true;
  render();
  refresh();
});

function persist() {
  bridge.saveWidgetState({ mounted: app.mounted, knownSessionKeys: [...app.knownSessionKeys] });
}

// Keeps the pinned session's task-history count fresh (the inline card's
// "1 running · 6 completed" line) — one bounded call, only for the session
// currently in focus, same session the timeline fetch already targets. A
// transient failure leaves whatever was cached before rather than blanking
// out a number that was already showing.
async function refreshPinnedCounts(sessionKey, isCurrent = () => true) {
  if (!sessionKey) return;
  try {
    const result = await bridge.callTool("get_session", { sessionId: sessionKey, mode: "tasks" });
    if (!isCurrent()) return; // a superseded refresh must not write — see refresh()
    app.expanded.set(sessionKey, result?.structuredContent?.tasks ?? result?.tasks ?? []);
  } catch {
    /* keep the previously cached counts */
  }
}

async function refresh() {
  // Bounded against what the compact card actually shows: it must not keep
  // polling on behalf of sessions it isn't allowed to render.
  if (!app.reconcileRequested && !shouldPoll({ pollInFlight: app.pollInFlight, tasks: compactVisibleTasks() })) return;
  app.reconcileRequested = false;
  app.pollInFlight = true;
  // A resume signal sets reconcileRequested and so deliberately bypasses the
  // pollInFlight guard above — and refreshOnInteraction routes an ordinary
  // click into that path, so two refreshes really can be in flight at once.
  // Without a guard the one that resolves LAST wins, which lets an older read
  // overwrite pinnedDetail with a staler snapshot or walk eventCursor
  // backwards. Both self-heal on the next poll, but the card visibly flickers
  // backwards in the meantime. Only the newest refresh may write; an older one
  // discards its result at every await and leaves the bookkeeping alone.
  const sequence = ++app.refreshSequence;
  const isCurrent = () => sequence === app.refreshSequence;
  try {
    // Always read the complete list, never the server's "active" filter, and
    // never a breadth that depends on which surface is open. view:"active"
    // omits terminal work, so the moment a task finished it fell out of the
    // read and the card lost the very thing the user was waiting for. State
    // should be complete and the *view* should filter.
    const result = await bridge.callTool("list_tasks", { view: "all" });
    if (!isCurrent()) return;
    const tasks = result?.structuredContent?.tasks ?? result?.tasks ?? [];
    // Stored as fetched — the canonical set. Compact scope is a render-time
    // view (compactVisibleTasks), not a narrowing of the store. Retention is
    // bounded to this card's own known sessions — see reconcileTaskList.
    app.tasks = reconcileTaskList(app.tasks, tasks, app.knownSessionKeys);

    const visible = compactVisibleTasks();
    app.compactSessionKey = resolveCompactSelection(app.mounted, visible, app.compactSessionKey) ?? null;
    const pinnedSessionKey = app.compactSessionKey ?? undefined;

    // Bounded: exactly one extra read, only for the one session the user is
    // actually looking at — never fan-out across every row.
    const sessionTasks = pinnedSessionKey ? visible.filter((t) => t.sessionKey === pinnedSessionKey) : [];
    // list_tasks omits nothing now (view:"all"), but the mounted run is still
    // authoritative and must be fetched directly while focus is on it, in
    // case a retention-pruned read hasn't caught up yet.
    const mountedFallback =
      app.mounted?.taskId && (!pinnedSessionKey || pinnedSessionKey === app.mounted.sessionKey)
        ? { taskId: app.mounted.taskId, jobId: app.mounted.taskId, sessionKey: app.mounted.sessionKey }
        : undefined;
    const selected = sessionTasks[0] ?? mountedFallback;
    if (selected) {
      const taskId = selected.taskId ?? selected.jobId;
      // detail:"full" (not "updates") — list_tasks' TaskSummary has no
      // `artifacts` field (see packages/core/src/tools.ts's listTasks()),
      // so without the full snapshot here, deriveTitle's PR/branch
      // detection would silently never have anything to show.
      //
      // knownLogCount resumes from wherever the last read for THIS task left
      // off — see mergeRingBuffer()/app.eventCursor. A cursor swap (new
      // taskId) naturally starts that task at its own bounded initial window.
      //
      // The original prompt is deliberately NOT fetched here. get_task
      // detail:"prompt" is a separate, heavier read (the full submitted task/
      // context text) that has no place in a recurring heartbeat — it's
      // fetched lazily, once, only when the user explicitly opens the
      // Request tab (see selectCardTab below).
      const detail = await bridge.callTool("get_task", { taskId, detail: "full", knownLogCount: app.eventCursor.get(taskId) ?? 0 });
      if (!isCurrent()) return;
      const snapshot = detail?.structuredContent ?? detail;
      // isTaskSnapshot, not a bare id check: a not-found reply carries the id
      // it was asked about, and merging it would overwrite a retained row with
      // an error envelope — cancelling the retention guarantee for exactly the
      // task the card is pinned to.
      const resolved = isTaskSnapshot(snapshot) ? snapshot : null;
      app.pinnedDetail = resolved;
      app.tasks = ensurePinnedTask(app.tasks, resolved);
      const delta = snapshot?.updates ?? snapshot?.logs ?? [];
      app.recentEvents.set(taskId, mergeRingBuffer(app.recentEvents.get(taskId), delta));
      if (typeof snapshot?.logCursor === "number") app.eventCursor.set(taskId, snapshot.logCursor);
      app.timeline = deriveTimeline(app.recentEvents.get(taskId), 3);
      app.timelineFor = taskId;
      await refreshPinnedCounts(snapshot?.sessionKey ?? pinnedSessionKey ?? app.mounted?.sessionKey, isCurrent);
      if (!isCurrent()) return;
    } else {
      app.pinnedDetail = null;
      app.timeline = [];
      app.timelineFor = null;
    }
    app.pollFailures = 0;
  } catch {
    if (!isCurrent()) return;
    app.pollFailures += 1;
  } finally {
    // Only the newest refresh clears the in-flight flag and re-arms the timer;
    // a superseded one leaves both to whoever superseded it. That refresh is
    // still running (or has already finished and done exactly this), so the
    // flag cannot leak — every path through this function reaches here.
    if (isCurrent()) {
      app.pollInFlight = false;
      dispatchRender();
      scheduleNext();
      syncElapsedTicker();
    }
  }
}

/**
 * Status group the compact card is currently pinned to, for the render-
 * cadence decision below and for scheduleNext()'s polling cadence.
 */
function currentPinnedGroup() {
  const tasks = compactVisibleTasks();
  const pinnedSessionKey = app.compactSessionKey ?? deriveViewMode(app.mounted, tasks).highlightSessionKey ?? app.mounted?.sessionKey;
  const pinned = tasks.find((t) => t.sessionKey === pinnedSessionKey);
  return pinned ? groupStatus(pinned.status) : "active";
}

// Debounces refresh()'s own re-renders: a lifecycle/terminal status-group
// transition (including the first render) always renders immediately: that's
// real state the user is owed right away. Cosmetic-only activity (same
// group, just new ring-buffer entries) coalesces into at most one render per
// COSMETIC_RENDER_DEBOUNCE_MS, so a run of quick polls doesn't thrash the DOM
// once per cycle. User-triggered renders (tab clicks, expand/collapse)
// bypass this entirely — they call render() directly.
const COSMETIC_RENDER_DEBOUNCE_MS = 1000;
function dispatchRender() {
  const nextGroup = currentPinnedGroup();
  if (shouldRenderImmediately(app.lastRenderedGroup, nextGroup)) {
    if (app.renderTimer) {
      clearTimeout(app.renderTimer);
      app.renderTimer = null;
    }
    app.lastRenderedGroup = nextGroup;
    render();
    return;
  }
  if (app.renderTimer) return; // a coalesced render is already pending
  app.renderTimer = setTimeout(() => {
    app.renderTimer = null;
    app.lastRenderedGroup = nextGroup;
    render();
  }, COSMETIC_RENDER_DEBOUNCE_MS);
}

// Elapsed-time display ("active 42s ago") is computed locally from
// lastEventAt on every render (see deriveActivityLabel) — this ticker only
// keeps that display fresh between network polls, on a render-only cadence
// with no tool call of its own. Runs only while there's visible non-terminal
// work; stops otherwise so an idle card holds no timer.
const ELAPSED_TICK_MS = 5000;
function syncElapsedTicker() {
  const hasActiveWork = compactVisibleTasks().some((t) => !["completed", "failed"].includes(groupStatus(t.status)));
  if (hasActiveWork && !app.elapsedTicker) {
    app.elapsedTicker = setInterval(() => render(), ELAPSED_TICK_MS);
  } else if (!hasActiveWork && app.elapsedTicker) {
    clearInterval(app.elapsedTicker);
    app.elapsedTicker = null;
  }
}

function scheduleNext() {
  // Cadence follows what the compact card is actually pinned to.
  const group = currentPinnedGroup();
  const delay = pollIntervalMs(group, app.pollFailures);
  if (delay === null) return; // terminal — stop polling entirely
  if (app.refreshTimer) clearTimeout(app.refreshTimer);
  app.refreshTimer = setTimeout(refresh, delay);
}

// Browsers throttle timers aggressively for backgrounded/suspended tabs. The
// first timer after resume can therefore run against stale/empty host state;
// explicitly reconcile on every host resume signal and keep the prior live
// rows until the read proves otherwise.
let resumeRefreshQueued = false;
function reconcileOnResume() {
  if (document.visibilityState === "hidden" || resumeRefreshQueued) return;
  resumeRefreshQueued = true;
  queueMicrotask(() => {
    resumeRefreshQueued = false;
    app.reconcileRequested = true;
    refresh();
  });
}
document.addEventListener("visibilitychange", reconcileOnResume);
window.addEventListener("focus", reconcileOnResume);
window.addEventListener("pageshow", reconcileOnResume);
// A network drop backgrounds nothing, so none of the signals above fire when
// connectivity comes back — the card just sits on whatever the failed poll
// left, backing off further with every pollFailures increment. Regaining the
// network is the one resume signal that was missing.
window.addEventListener("online", reconcileOnResume);

// visibilitychange/focus only fire when the whole page backgrounds. Switching
// between chats inside the ChatGPT app doesn't background anything, so a card
// the user just scrolled back to can be a full poll interval stale with no
// resume signal to hang a refresh on. Touching or hovering the card is the
// clearest "I am looking at this now" signal available, so treat it as one —
// throttled, and it only ever reads (get_task never waits server-side).
//
// `click`, never `pointerdown`: render() replaces the whole tree, so a refresh
// fired on pointerdown tears the target out from under the finger that is
// pressing it and the click never lands on the original node. `click` fires
// after the target's own handler has run, so the gesture always completes
// first. pointerenter keeps the desktop hover signal, and hovering moves no
// nodes.
let lastInteractionRefresh = 0;
function refreshOnInteraction() {
  const now = Date.now();
  if (now - lastInteractionRefresh < 2000) return;
  lastInteractionRefresh = now;
  reconcileOnResume();
}
window.addEventListener("click", refreshOnInteraction, { passive: true });
window.addEventListener("pointerenter", refreshOnInteraction, { passive: true });

/**
 * Remember the tab per task and, for "request", fetch that task's prompt now.
 *
 * refresh() never fetches the prompt (see the comment there) — this is the
 * ONLY place get_task(detail:"prompt") is ever called, exactly once per
 * taskId (cached in app.promptText afterward), and guarded by
 * app.promptLoading so a rapid re-select of the tab before the first fetch
 * resolves can't fire a second concurrent request.
 */
async function selectCardTab(taskId, tab, task) {
  app.cardTabByTask.set(taskId, tab);
  render();
  if (tab !== "request" || app.promptText.has(taskId) || app.promptLoading.has(taskId) || !canReadPrompt(task)) return;
  app.promptLoading.add(taskId);
  try {
    const result = await bridge.callTool("get_task", { taskId, detail: "prompt" });
    const prompt = result?.structuredContent?.prompt ?? result?.prompt;
    if (prompt?.task != null) app.promptText.set(taskId, prompt.task);
  } catch {
    // Leave the loading state; the next explicit tab selection may retry.
  } finally {
    app.promptLoading.delete(taskId);
    render();
  }
}

async function toggleExpand(sessionKey) {
  if (app.historyOpen.has(sessionKey)) {
    app.historyOpen.delete(sessionKey);
    render();
    return;
  }
  app.historyOpen.add(sessionKey);
  // The pinned session's history is already kept fresh by refreshPinnedCounts()
  // on every poll — only fetch here if nothing's cached yet (a non-pinned row,
  // or before the first refresh has landed).
  if (!app.expanded.has(sessionKey)) {
    try {
      const result = await bridge.callTool("get_session", { sessionId: sessionKey, mode: "tasks" });
      app.expanded.set(sessionKey, result?.structuredContent?.tasks ?? result?.tasks ?? []);
    } catch {
      app.expanded.set(sessionKey, []);
    }
  }
  render();
}

function composeFollowUp(sessionKey, text) {
  // Actions are messages, never mutations — the widget never calls a
  // mutating tool itself; it hands a prompt back to the assistant.
  window.openai?.sendFollowUpMessage?.({ prompt: `${text} (sessionKey: ${sessionKey})` });
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props ?? {})) {
    if (k === "onclick") node.addEventListener("click", v);
    else if (k === "onkeydown") node.addEventListener("keydown", v);
    else if (k === "class") node.className = v;
    else node.setAttribute(k, v);
  }
  for (const child of children ?? []) {
    if (child === null || child === undefined) continue;
    node.append(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

function contentNode(className, value) {
  const node = el("div", { class: className }, []);
  const text = String(value ?? "");
  if (isLikelyMarkdown(text)) node.innerHTML = renderMarkdownHtml(text);
  else { node.classList.add("cc-plain"); node.textContent = text; }
  return node;
}

function renderRow(row, opts = {}) {
  const taskId = row.latestTask.taskId ?? row.latestTask.jobId;
  const pill = deriveStatusPill(row.group);
  const history = app.expanded.get(row.sessionKey);
  const historyOpen = app.historyOpen.has(row.sessionKey);
  const promptResolved = app.promptText.has(taskId);
  // Concise recent activity — the live evidence shown below the response,
  // from the client-side ring buffer (see mergeRingBuffer/app.recentEvents),
  // not a single line derived fresh from one snapshot. At most 3 rows.
  const recentActivity = taskId === app.timelineFor ? app.timeline : [];

  const children = [];
  const headChildren = [
    el("div", { class: "cc-head" }, [
      el("div", { class: "cc-title" }, [row.title]),
      el("span", { class: `cc-pill cc-pill--${row.group}` }, [`${pill.icon} ${pill.label}`]),
    ]),
    el("div", { class: "cc-meta" }, [
      `${row.latestTask.agent ?? "?"} · ${deriveActivityLabel(row.latestTask, Date.now())}`,
    ]),
  ];

  const cardTabs = deriveCardTabs(row.latestTask);
  const activeTab = app.cardTabByTask.get(taskId) ?? defaultCardTab(row.latestTask);
  const tabLabels = { response: "Response", diagnostics: "Diagnostics", request: "Request" };
  const tablistId = `cc-tabs-${String(taskId).replace(/[^a-zA-Z0-9_-]/g, "-")}`;
  children.push(
    el("div", { class: "cc-card-tabs", role: "tablist", "aria-label": "Task details", id: tablistId }, [
      ...cardTabs.map((tab) =>
      el("button", {
        class: "cc-card-tab",
        role: "tab",
        id: `${tablistId}-${tab}`,
        "aria-selected": activeTab === tab ? "true" : "false",
        "aria-controls": `${tablistId}-panel`,
        tabindex: activeTab === tab ? "0" : "-1",
        onclick: (e) => { e.stopPropagation(); selectCardTab(taskId, tab, row.latestTask); },
        onkeydown: (e) => {
          const next = nextCardTab(cardTabs, activeTab, e.key);
          if (next !== activeTab) { e.preventDefault(); selectCardTab(taskId, next, row.latestTask); document.getElementById(`${tablistId}-${next}`)?.focus(); }
        },
      }, [tabLabels[tab]]),
      ),
    ]),
  );

  // Tabs lead the card, then the title row and meta line beneath them.
  children.push(...headChildren);

  const panelChildren = [];
  if (activeTab === "request") {
    if (promptResolved) {
      panelChildren.push(
        el("div", { class: "cc-prompt" }, [
          el("div", { class: "cc-prompt-head" }, ["Original request"]),
          contentNode("cc-prompt-body", app.promptText.get(taskId)),
        ]),
      );
    } else if (canReadPrompt(row.latestTask)) {
      panelChildren.push(el("div", { class: "cc-prompt cc-prompt-loading" }, ["Loading request…"]));
    }
  } else if (activeTab === "diagnostics") {
    const info = row.latestTask.error ?? row.latestTask.errorInfo?.message ?? row.latestTask.errorInfo?.category ?? "The task failed without additional diagnostics.";
    panelChildren.push(el("div", { class: "cc-diagnostics" }, [String(info)]));
  } else {
    if (row.latestTask.summary) {
      panelChildren.push(contentNode("cc-response", row.latestTask.summary));
    } else if (row.latestTask.status === "completed_no_summary") {
      panelChildren.push(contentNode("cc-response", "Finished - no response summary was returned."));
    } else if (row.latestTask.status === "running" || row.latestTask.status === "queued") {
      // The status pill and recent-activity list are the explanation while a
      // task runs. Keep the response area quiet until there is an actual response.
      if (recentActivity.length === 0) panelChildren.push(el("span", { class: "cc-live-loading", role: "status", "aria-label": "Task is running" }, []));
    }
  }
  children.push(el("div", { role: "tabpanel", id: `${tablistId}-panel`, "aria-labelledby": `${tablistId}-${activeTab}` }, panelChildren));

  // The actual evidence behind "is working" — real log lines, not just a
  // status word. Only present for the one row currently in focus/highlighted
  // (refresh() only fetches it there — see the bounded-reads note in refresh()).
  for (const entry of recentActivity) {
    children.push(
      el("div", { class: "cc-update" }, [
        // Lifecycle/tool rows are evidence, not task status. Keep them
        // neutral unless the event itself carried an error bit.
        el("span", { class: "cc-update-icon" }, [entry.isError ? "✕" : "•"]),
        el("span", { class: "cc-update-text" }, [entry.count > 1 ? `${entry.text} ×${entry.count}` : entry.text]),
      ]),
    );
  }

  // Compact counts by default ("1 running · 6 completed"); the itemized
  // list only once the user explicitly asks for it (click) — keeps the
  // inline card compact per the preserved design constraint.
  if (history && history.length > 0) {
    if (historyOpen) {
      children.push(
        el(
          "div",
          { class: "cc-history" },
          history.map((h) =>
            el("div", { class: "cc-history-item" }, [
              el("span", { class: `cc-dot cc-dot--${groupStatus(h.status)}` }, []),
              deriveTitle(h),
            ]),
          ),
        ),
      );
    } else {
      const counts = formatCounts(deriveCounts(history));
      if (counts) children.push(el("div", { class: "cc-counts" }, [counts]));
    }
  }

  const classes = opts.pinned ? "cc-row cc-row--pinned" : "cc-row";
  return el("div", { class: classes, onclick: () => toggleExpand(row.sessionKey) }, children);
}

function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  root.className = "";
  renderInline(root);
  persist();
}

function renderInline(root) {
  // Above the rows, because it explains the card itself rather than any one
  // task — and it must never be mistaken for a task's own status pill.
  const notice = deriveConnectionNotice({ pollFailures: app.pollFailures, recovery: app.pinnedDetail?.recovery });
  if (notice.text) {
    root.append(el("div", { class: "cc-note", role: "status" }, [notice.text]));
  }
  const tasks = compactVisibleTasks();
  const pinnedSessionKey =
    app.compactSessionKey ?? deriveViewMode(app.mounted, tasks).highlightSessionKey ?? app.mounted?.sessionKey;
  const rows = buildSessionRows(ensurePinnedTask(tasks, app.pinnedDetail), { highlightSessionKey: pinnedSessionKey });
  // The pinned (focused/mounted) session always shows, finished or not —
  // a task completing is exactly when its result matters most. The Active
  // filter only ever declutters everything else.
  const visibleRows = filterRows(rows, app.view, pinnedSessionKey);

  if (visibleRows.length === 0) {
    if (tasks.length === 0) {
      root.append(el("div", { class: "cc-empty", role: "status" }, [
        el("span", { class: "cc-empty-icon", "aria-hidden": "true" }, ["○"]),
        el("div", {}, [
          el("div", { class: "cc-empty-title" }, ["No active tasks"]),
          el("div", { class: "cc-empty-copy" }, ["New delegated tasks will appear here while they run."]),
        ]),
      ]));
    } else {
      root.append(el("div", { class: "cc-empty", role: "status" }, [
        el("span", { class: "cc-empty-icon", "aria-hidden": "true" }, ["○"]),
        el("div", {}, [
          el("div", { class: "cc-empty-title" }, ["Nothing needs attention"]),
          el("div", { class: "cc-empty-copy" }, ["Switch to Recent to view completed tasks."]),
        ]),
      ]));
    }
  } else {
    for (const row of visibleRows) root.append(renderRow(row, { pinned: row.sessionKey === pinnedSessionKey }));
  }
}

rehydrate();
render();
refresh();
</script>
</body>
</html>
