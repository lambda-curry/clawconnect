<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --cc-bg: var(--color-background-primary, #ffffff);
    --cc-bg-subtle: var(--color-background-secondary, #f7f7f8);
    --cc-fg: var(--color-text-primary, #111111);
    --cc-fg-muted: var(--color-text-secondary, #666666);
    --cc-border: var(--color-border-primary, #e2e2e2);
    /* Actions stay neutral so the widget blends into the host surface.
       Status colors are reserved for status pills/dots and paired with
       visible icons + labels, never used as general-purpose accents. */
    --cc-action-bg: #f1f1f1;
    --cc-action-hover: #e7e7e7;
    --cc-action-selected: #e4e4e4;
    --cc-action-fg: #252525;
    --cc-active: #9a7b45;
    --cc-needs-attention: #9a6b4a;
    --cc-completed: #63856d;
    --cc-failed: #a56b6b;
  }
  :root[data-theme="dark"] {
    --cc-bg: var(--color-background-primary, #18181b);
    --cc-bg-subtle: var(--color-background-secondary, #232326);
    --cc-fg: var(--color-text-primary, #f4f4f5);
    --cc-fg-muted: var(--color-text-secondary, #a1a1aa);
    --cc-border: var(--color-border-primary, #3f3f46);
    --cc-action-bg: #2b2b2f;
    --cc-action-hover: #35353a;
    --cc-action-selected: #38383d;
    --cc-action-fg: #e4e4e7;
    --cc-active: #c0a06a;
    --cc-needs-attention: #bd8b68;
    --cc-completed: #83aa8c;
    --cc-failed: #c58a8a;
  }
  @media (prefers-color-scheme: dark) {
    /* Only applies before the host has told us its theme via hostContext —
       data-theme (set explicitly, see applyTheme()) always wins over this
       in both directions, per the bug the prior widget shipped. */
    :root:not([data-theme]) {
      --cc-bg: #18181b;
      --cc-bg-subtle: #232326;
      --cc-fg: #f4f4f5;
      --cc-fg-muted: #a1a1aa;
      --cc-border: #3f3f46;
      --cc-action-bg: #2b2b2f;
      --cc-action-hover: #35353a;
      --cc-action-selected: #38383d;
      --cc-action-fg: #e4e4e7;
      --cc-active: #c0a06a;
      --cc-needs-attention: #bd8b68;
      --cc-completed: #83aa8c;
      --cc-failed: #c58a8a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--cc-bg);
    color: var(--cc-fg);
  }
  #root { padding: 10px 12px; overflow-x: hidden; }
  .cc-row {
    border: 1px solid var(--cc-border); border-left: 3px solid var(--cc-border); border-radius: 10px; padding: 12px 14px;
    margin-bottom: 8px; cursor: pointer; position: relative;
  }
  .cc-row:last-child { margin-bottom: 0; }
  /* Keep focus visible through structure and neutral contrast, not accent. */
  .cc-row--pinned { border-color: var(--cc-border); border-left-color: var(--cc-border); }
  .cc-row--pinned::before {
    content: none;
  }
  .cc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .cc-title { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cc-pill {
    flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap;
  }
  .cc-pill--active { color: var(--cc-active); }
  .cc-pill--needs_attention { color: var(--cc-needs-attention); }
  .cc-pill--completed { color: var(--cc-completed); }
  .cc-pill--failed { color: var(--cc-failed); }
  .cc-meta { color: var(--cc-fg-muted); font-size: 11.5px; margin-top: 3px; }
  .cc-update { display: flex; align-items: baseline; gap: 6px; margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--cc-border); color: var(--cc-fg-muted); font-size: 11px; }
  .cc-update-icon { flex: none; }
  .cc-counts { color: var(--cc-fg-muted); font-size: 11.5px; margin-top: 6px; }
  .cc-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .cc-dot--active { background: var(--cc-active); }
  .cc-dot--needs_attention { background: var(--cc-needs-attention); }
  .cc-dot--completed { background: var(--cc-completed); }
  .cc-dot--failed { background: var(--cc-failed); }
  .cc-history { margin-top: 8px; padding-left: 12px; border-left: 2px solid var(--cc-border); }
  .cc-history-item { font-size: 12px; padding: 3px 0; color: var(--cc-fg-muted); }
  .cc-actions { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .cc-card-tabs { display: flex; gap: 2px; margin: -12px -14px 10px; padding: 0 12px; border-bottom: 1px solid var(--cc-border); background: var(--cc-bg-subtle); }
  .cc-card-tab { flex: 0 1 auto; min-width: 0; padding: 6px 10px 5px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--cc-fg-muted); font: inherit; font-size: 11px; cursor: pointer; }
  .cc-card-tab:hover { color: var(--cc-fg); background: var(--cc-action-hover); }
  .cc-card-tab[aria-selected="true"] { border-bottom-color: var(--cc-fg); color: var(--cc-fg); font-weight: 600; }
  .cc-card-tab:focus-visible { outline: 2px solid var(--cc-fg-muted); outline-offset: -2px; }
  .cc-response { margin-top: 8px; font-size: 12.5px; }
  .cc-response.cc-plain, .cc-prompt-body.cc-plain { white-space: pre-wrap; }
  .cc-response h1, .cc-response h2, .cc-response h3, .cc-prompt-body h1, .cc-prompt-body h2, .cc-prompt-body h3 { margin: 10px 0 4px; line-height: 1.25; }
  .cc-response p, .cc-prompt-body p { margin: 5px 0; }
  .cc-response ul, .cc-response ol, .cc-prompt-body ul, .cc-prompt-body ol { margin: 5px 0; padding-left: 20px; }
  .cc-response blockquote, .cc-prompt-body blockquote { margin: 7px 0; padding-left: 10px; border-left: 3px solid var(--cc-border); color: var(--cc-fg-muted); }
  .cc-response code, .cc-prompt-body code { padding: 1px 4px; border-radius: 4px; background: var(--cc-bg-subtle); font: 0.9em ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cc-response pre, .cc-prompt-body pre { margin: 8px 0; padding: 9px 10px; overflow-x: auto; border-radius: 7px; background: #202124; color: #e8eaed; }
  .cc-response pre code, .cc-prompt-body pre code { padding: 0; background: none; color: inherit; }
  .cc-response table, .cc-prompt-body table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
  .cc-response th, .cc-response td, .cc-prompt-body th, .cc-prompt-body td { border: 1px solid var(--cc-border); padding: 4px 7px; text-align: left; }
  .cc-response th, .cc-prompt-body th { background: var(--cc-bg-subtle); font-weight: 600; }
  .cc-response a, .cc-prompt-body a { color: var(--cc-active); text-decoration: underline; }
  .cc-diagnostics { margin-top: 8px; font-size: 12px; white-space: pre-wrap; color: var(--cc-failed); }
  .cc-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; min-height: 28px; }
  .cc-control {
    display: inline-flex; align-items: center; gap: 5px; min-height: 28px;
    padding: 4px 8px; font-size: 11.5px; border-radius: 7px;
  }
  .cc-control-icon { font-size: 14px; line-height: 1; }
  .cc-btn {
    font: inherit; padding: 5px 10px; border-radius: 7px; border: 1px solid var(--cc-border);
    background: transparent; color: var(--cc-fg); cursor: pointer;
  }
  .cc-btn:hover { background: var(--cc-action-hover); border-color: var(--cc-border); }
  .cc-btn:focus-visible { outline: 2px solid var(--cc-fg-muted); outline-offset: 2px; }
  .cc-btn--primary { background: var(--cc-action-bg); border-color: var(--cc-border); color: var(--cc-action-fg); font-weight: 600; }
  .cc-footer { margin-top: 10px; color: var(--cc-fg-muted); font-size: 11px; }
  .cc-prompt { margin-top: 8px; border-radius: 8px; background: var(--cc-bg-subtle); border: 1px solid var(--cc-border); overflow: hidden; }
  .cc-prompt-head {
    display: flex; align-items: center; justify-content: space-between; padding: 6px 10px;
    font-size: 11px; font-weight: 600; color: var(--cc-fg-muted); border-bottom: 1px solid var(--cc-border);
  }
  .cc-prompt-body { padding: 8px 10px; font-size: 12px; }
  .cc-prompt-loading { padding: 10px; color: var(--cc-fg-muted); }
  .cc-prompt-close { background: none; border: none; color: var(--cc-fg-muted); cursor: pointer; font: inherit; padding: 0; }
  .cc-note { color: var(--cc-fg-muted); font-size: 11px; margin-top: 8px; }
  .cc-empty {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--cc-border); border-radius: 9px; background: var(--cc-bg-subtle);
    min-height: 58px;
  }
  .cc-empty-icon { color: var(--cc-fg-muted); font-size: 16px; line-height: 1.35; }
  .cc-empty-title { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .cc-empty-copy { color: var(--cc-fg-muted); font-size: 11.5px; line-height: 1.4; margin-top: 2px; }
  .cc-live-loading { display: inline-block; width: 10px; height: 10px; margin-top: 10px; border: 1.5px solid var(--cc-border); border-top-color: var(--cc-fg-muted); border-radius: 50%; animation: cc-spin .8s linear infinite; }
  @keyframes cc-spin { to { transform: rotate(360deg); } }

  /* ── Fullscreen ("Task Center") — same tested pure functions as inline,
     a different layout only. Never load-bearing: see openTaskCenter(). */
  #root.cc-fullscreen { padding: 0; height: 100vh; display: flex; flex-direction: column; }
  .cc-fs-header {
    flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--cc-border);
  }
  .cc-fs-title { font-weight: 700; font-size: 15px; }
  .cc-fs-body { flex: 1; display: flex; overflow: hidden; }
  .cc-fs-sidebar { width: 220px; flex: none; border-right: 1px solid var(--cc-border); overflow-y: auto; padding: 10px; }
  .cc-fs-session { padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; border-left: 3px solid transparent; }
  .cc-fs-session--selected { background: var(--cc-bg-subtle); border-left-color: var(--cc-border); }
  .cc-fs-main { flex: 1; display: flex; overflow: hidden; }
  .cc-fs-tasklist { width: 260px; flex: none; border-right: 1px solid var(--cc-border); overflow-y: auto; padding: 10px; }
  .cc-fs-task { display: flex; align-items: center; padding: 7px 8px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  .cc-fs-task--selected { background: var(--cc-bg-subtle); }
  .cc-fs-detail { flex: 1; overflow-y: auto; padding: 16px 18px; }
  .cc-fs-tabs { display: flex; gap: 6px; margin: 12px 0; }
  .cc-fs-detail-body { font-size: 13px; }
  .cc-fs-detail-body > * { margin-bottom: 8px; }
  @media (max-width: 640px) {
    .cc-fs-body { flex-direction: column; overflow-y: auto; }
    .cc-fs-sidebar, .cc-fs-tasklist { width: 100%; border-right: none; border-bottom: 1px solid var(--cc-border); max-height: 180px; }
    .cc-fs-main { flex-direction: column; }
  }
</style>
</head>
<body>
<div id="root">Loading…</div>
<script>
__STATE_MODULE__

// ── Bridge: window.openai primary (ChatGPT's actual implemented surface),
// a minimal hand-rolled MCP-Apps postMessage fallback for a spec-compliant
// host that doesn't implement window.openai. Read-only/navigation only —
// no ui/message completion, no mutation calls, ever.
const bridge = (() => {
  let mcpAppsRequestId = 0;
  const pending = new Map();

  function viaWindowOpenAI() {
    return typeof window.openai?.callTool === "function" ? window.openai : null;
  }

  function initMcpAppsFallback() {
    window.addEventListener("message", (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== "object" || msg.id === undefined) return;
      const resolver = pending.get(msg.id);
      if (!resolver) return;
      pending.delete(msg.id);
      if (msg.error) resolver.reject(new Error(msg.error.message || "tool call failed"));
      else resolver.resolve(msg.result);
    });
    // Full ui/initialize -> ui/notifications/initialized handshake, per
    // App.connect() in @modelcontextprotocol/ext-apps@1.5.0 (dist/src/
    // app-bridge.js) — a spec-compliant host won't route ui/message,
    // tools/call, or ui/request-display-mode to this view until it sees
    // this. A real ChatGPT host (window.openai path) never speaks raw
    // postMessage JSON-RPC, so this simply times out there and is ignored —
    // window.openai remains the primary path everywhere else in this file.
    sendMcpAppsRequest("ui/initialize", buildUiInitializeParams(), 5000)
      .then(() => {
        window.parent?.postMessage(buildUiInitializedNotification(), "*");
      })
      .catch(() => {
        // No spec-compliant host answered — nothing to recover, every other
        // fallback call already treats its own timeout as "unsupported".
      });
  }
  initMcpAppsFallback();

  function sendMcpAppsRequest(method, params, timeoutMs) {
    const id = `cc-${++mcpAppsRequestId}`;
    const result = new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      setTimeout(() => {
        if (pending.has(id)) {
          pending.delete(id);
          reject(new Error(`${method} timed out`));
        }
      }, timeoutMs);
    });
    window.parent?.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    return result;
  }

  async function callTool(name, args) {
    const openai = viaWindowOpenAI();
    if (openai) return openai.callTool(name, args);
    return sendMcpAppsRequest("tools/call", { name, arguments: args }, 15000);
  }

  /**
   * Display mode is a *request*, not a contract — per
   * developers.openai.com/plugins/reference.md ("no explicit guarantees
   * that hosts will honor display mode requests... hosts retain
   * discretion") and the ext-apps spec's own doc comment on
   * McpUiRequestDisplayModeRequest ("the host will respond with the actual
   * display mode that was set, which may differ from the requested mode
   * if not supported"). There is also no reliable way to ask a host in
   * advance whether it supports a mode at all — window.openai exposes no
   * such query. The only correct pattern is: request, then read back
   * whatever the host says actually happened (the resolved value if the
   * call succeeds, `displayMode` afterward either way) — never assume the
   * request took effect.
   */
  function supportsDisplayModeRequest() {
    const openai = viaWindowOpenAI();
    return typeof openai?.requestDisplayMode === "function";
  }

  async function requestDisplayMode(mode) {
    const openai = viaWindowOpenAI();
    if (openai?.requestDisplayMode) {
      const result = await openai.requestDisplayMode({ mode });
      return result?.mode ?? openai.displayMode ?? mode;
    }
    // Minimal MCP-Apps fallback — same request shape as the App class's
    // requestDisplayMode, same "response may differ from what was asked"
    // caveat applies.
    const result = await sendMcpAppsRequest("ui/request-display-mode", { mode }, 5000).catch(() => null);
    return result?.mode ?? "inline";
  }

  function currentDisplayMode() {
    return viaWindowOpenAI()?.displayMode ?? "inline";
  }

  function onDisplayModeChange(cb) {
    window.addEventListener("openai:set_globals", () => cb(currentDisplayMode()));
  }

  function readMountData() {
    const openai = viaWindowOpenAI();
    const output = openai?.toolOutput ?? null;
    return output?.structuredContent ?? output ?? null;
  }

  function readWidgetState() {
    return viaWindowOpenAI()?.widgetState ?? null;
  }

  function saveWidgetState(value) {
    viaWindowOpenAI()?.setWidgetState?.(value);
  }

  function currentTheme() {
    return viaWindowOpenAI()?.theme ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }

  function onThemeChange(cb) {
    window.addEventListener("openai:set_globals", () => cb(currentTheme()));
  }

  return {
    callTool,
    readMountData,
    readWidgetState,
    saveWidgetState,
    currentTheme,
    onThemeChange,
    supportsDisplayModeRequest,
    requestDisplayMode,
    currentDisplayMode,
    onDisplayModeChange,
  };
})();

function applyTheme() {
  document.documentElement.setAttribute("data-theme", bridge.currentTheme());
}
applyTheme();
bridge.onThemeChange(applyTheme);

// ── App state — bridge/DOM glue only. Every decision (grouping, titles,
// view collapse, cadence, dedup) is delegated to the tested pure functions
// imported above; this section never re-implements that logic.
const app = {
  mounted: null,
  tasks: [],
  view: "active",
  allActivity: false,
  knownSessionKeys: new Set(),
  pollInFlight: false,
  pollFailures: 0,
  refreshTimer: null,
  reconcileRequested: false,
  expanded: new Map(), // sessionKey -> history[] (task summaries) — for the pinned session this is kept fresh automatically every refresh(); for any other row it's fetched once on click
  historyOpen: new Set(), // sessionKeys where the itemized history list should render, vs. just the compact counts line
  promptText: new Map(), // taskId -> preloaded prompt text
  promptLoading: new Set(),
  timeline: [], // deriveTimeline() output for the one focused/highlighted task — the actual evidence behind "is working"
  timelineFor: null, // taskId the current timeline belongs to, so a stale fetch never renders under the wrong row
  pinnedDetail: null, // full JobSnapshot (artifacts included) for the one pinned/selected task — see mergePinnedDetail()
  cardTab: "response",
  cardTabFor: null,
  // Fullscreen — see openTaskCenter(). displayMode reflects what the host
  // actually confirmed, never what was merely requested.
  displayMode: "inline",
  displayModeNote: null, // set when a fullscreen request was made but not honored — shown once, inline, not a silent failure
  selectedSessionKey: null, // fullscreen sidebar selection
  selectedTaskId: null, // fullscreen task-list selection
  detailTab: "overview",
};

// Fullscreen is a request, never a dependency — every read/action the
// fullscreen view uses is identical to the inline card's; the only
// difference is layout. If the host never confirms fullscreen, the card
// stays exactly as useful as it already was.
async function openTaskCenter() {
  if (!bridge.supportsDisplayModeRequest()) {
    app.displayModeNote = "Fullscreen isn't available in this host.";
    render();
    return;
  }
  let granted = "inline";
  try {
    granted = await bridge.requestDisplayMode("fullscreen");
  } catch {
    granted = "inline";
  }
  if (granted === "fullscreen") {
    app.displayMode = "fullscreen";
    app.displayModeNote = null;
    // Fullscreen is the "see everything" surface — widen scope so the
    // sidebar isn't just the one pinned session, and show every group by
    // default.
    app.allActivity = true;
    app.view = "recent";
    app.selectedSessionKey = app.selectedSessionKey ?? app.mounted?.sessionKey ?? null;
    refresh();
  } else {
    app.displayModeNote = "The host didn't grant fullscreen — staying inline.";
  }
  render();
}

function closeTaskCenter() {
  // Best-effort request back to inline; the local state flips regardless
  // so the Close button always visibly works even if the host is slow or
  // never confirms — same "never load-bearing" principle as everywhere
  // else the card fetches something.
  bridge.requestDisplayMode("inline").catch(() => {});
  app.displayMode = "inline";
  render();
}

bridge.onDisplayModeChange((mode) => {
  // The host can also change display mode on its own (e.g. its own chrome
  // close button) — stay in sync rather than trusting only our own calls.
  if (mode !== app.displayMode) {
    app.displayMode = mode === "fullscreen" ? "fullscreen" : "inline";
    render();
  }
});

function rehydrate() {
  const mountData = bridge.readMountData();
  if (mountData?.jobId || mountData?.taskId) {
    app.mounted = { taskId: mountData.taskId ?? mountData.jobId, sessionKey: mountData.sessionKey };
    app.knownSessionKeys.add(app.mounted.sessionKey);
  }
  const saved = bridge.readWidgetState();
  if (saved?.knownSessionKeys) for (const k of saved.knownSessionKeys) app.knownSessionKeys.add(k);
  if (!app.mounted && saved?.mounted) app.mounted = saved.mounted;
}

function persist() {
  bridge.saveWidgetState({ mounted: app.mounted, knownSessionKeys: [...app.knownSessionKeys] });
}

// Keeps the pinned session's task-history count fresh (the inline card's
// "1 running · 6 completed" line) — one bounded call, only for the session
// currently in focus, same session the timeline fetch already targets. A
// transient failure leaves whatever was cached before rather than blanking
// out a number that was already showing.
async function refreshPinnedCounts(sessionKey) {
  if (!sessionKey) return;
  try {
    const result = await bridge.callTool("get_session", { sessionId: sessionKey, mode: "tasks" });
    app.expanded.set(sessionKey, result?.structuredContent?.tasks ?? result?.tasks ?? []);
  } catch {
    /* keep the previously cached counts */
  }
}

async function refresh() {
  if (!app.reconcileRequested && !shouldPoll({ pollInFlight: app.pollInFlight, tasks: app.tasks })) return;
  app.reconcileRequested = false;
  app.pollInFlight = true;
  const fullscreen = app.displayMode === "fullscreen";
  try {
    // Always fetch the task list first, never just the one pinned task in
    // isolation. Bug found via browser smoke test: an earlier version
    // special-cased "only one active session known so far" (view.mode ===
    // "focused") to skip list_tasks and fetch only that one task — but
    // that's self-reinforcing. deriveViewMode's "focused vs aggregate"
    // decision is computed FROM app.tasks, and app.tasks only grows by
    // calling list_tasks — so a card that started single-task could never
    // discover a second session came into existence, and toggling "All
    // activity" (which only flips a fetch parameter) had no visible effect
    // because the branch that would use it never ran. One list_tasks call
    // per cycle is a small, already-bounded cost; the alternative is a
    // card that can get stuck narrow forever.
    const listView = fullscreen || app.allActivity ? "all" : "active";
    const result = await bridge.callTool("list_tasks", { view: listView });
    const tasks = result?.structuredContent?.tasks ?? result?.tasks ?? [];
    const scope = resolveScope([...app.knownSessionKeys], app.allActivity || fullscreen);
    app.tasks = reconcileTaskList(app.tasks, filterTasksByScope(tasks, scope));

    const view = deriveViewMode(app.mounted, app.tasks);
    const pinnedSessionKey = fullscreen
      ? (app.selectedSessionKey ?? view.highlightSessionKey)
      : (view.mode === "focused" ? view.sessionKey : view.highlightSessionKey);

    // Bounded: exactly one extra read, only for the one session the user is
    // actually looking at (pinned inline, or selected in the fullscreen
    // sidebar) — never fan-out across every row in the command center.
    const sessionTasks = pinnedSessionKey ? app.tasks.filter((t) => t.sessionKey === pinnedSessionKey) : [];
    const selected =
      (app.selectedTaskId && sessionTasks.find((t) => (t.taskId ?? t.jobId) === app.selectedTaskId)) ??
      sessionTasks[0] ??
      // list_tasks(view:"active") intentionally omits completed work. The
      // mounted run is still authoritative and must be fetched directly.
      (app.mounted?.taskId ? { taskId: app.mounted.taskId, jobId: app.mounted.taskId, sessionKey: app.mounted.sessionKey } : undefined);
    if (selected) {
      const taskId = selected.taskId ?? selected.jobId;
      // detail:"full" (not "updates") — list_tasks' TaskSummary has no
      // `artifacts` field (see packages/core/src/tools.ts's listTasks()),
      // so without the full snapshot here, deriveTitle's PR/branch
      // detection and the fullscreen Artifacts tab would silently never
      // have anything to show for *any* row, pinned or not.
      const [detail, promptDetail] = await Promise.all([
        bridge.callTool("get_task", { taskId, detail: "full" }),
        bridge.callTool("get_task", { taskId, detail: "prompt" }),
      ]);
      const snapshot = detail?.structuredContent ?? detail;
      const prompt = promptDetail?.structuredContent?.prompt ?? promptDetail?.prompt;
      if (prompt?.task != null) app.promptText.set(taskId, prompt.task);
      app.pinnedDetail = snapshot?.jobId || snapshot?.taskId ? snapshot : null;
      app.tasks = ensurePinnedTask(app.tasks, app.pinnedDetail);
      app.timeline = deriveTimeline(snapshot?.updates ?? snapshot?.logs ?? []);
      app.timelineFor = taskId;
      await refreshPinnedCounts(snapshot?.sessionKey ?? pinnedSessionKey ?? app.mounted?.sessionKey);
    } else {
      app.pinnedDetail = null;
      app.timeline = [];
      app.timelineFor = null;
    }
    app.pollFailures = 0;
  } catch {
    app.pollFailures += 1;
  } finally {
    app.pollInFlight = false;
    render();
    scheduleNext();
  }
}

function scheduleNext() {
  const view = deriveViewMode(app.mounted, app.tasks);
  const group =
    view.mode === "focused"
      ? groupStatus(app.tasks.find((t) => t.taskId === view.taskId || t.jobId === view.taskId)?.status ?? "running")
      : "active";
  const delay = pollIntervalMs(group, app.pollFailures);
  if (delay === null) return; // terminal — stop polling entirely
  if (app.refreshTimer) clearTimeout(app.refreshTimer);
  app.refreshTimer = setTimeout(refresh, delay);
}

// Browsers throttle timers aggressively for backgrounded/suspended tabs. The
// first timer after resume can therefore run against stale/empty host state;
// explicitly reconcile on every host resume signal and keep the prior live
// rows until the read proves otherwise.
let resumeRefreshQueued = false;
function reconcileOnResume() {
  if (document.visibilityState === "hidden" || resumeRefreshQueued) return;
  resumeRefreshQueued = true;
  queueMicrotask(() => {
    resumeRefreshQueued = false;
    app.reconcileRequested = true;
    refresh();
  });
}
document.addEventListener("visibilitychange", reconcileOnResume);
window.addEventListener("focus", reconcileOnResume);
window.addEventListener("pageshow", reconcileOnResume);

async function toggleExpand(sessionKey) {
  if (app.historyOpen.has(sessionKey)) {
    app.historyOpen.delete(sessionKey);
    render();
    return;
  }
  app.historyOpen.add(sessionKey);
  // The pinned session's history is already kept fresh by refreshPinnedCounts()
  // on every poll — only fetch here if nothing's cached yet (a non-pinned row,
  // or before the first refresh has landed).
  if (!app.expanded.has(sessionKey)) {
    try {
      const result = await bridge.callTool("get_session", { sessionId: sessionKey, mode: "tasks" });
      app.expanded.set(sessionKey, result?.structuredContent?.tasks ?? result?.tasks ?? []);
    } catch {
      app.expanded.set(sessionKey, []);
    }
  }
  render();
}

function composeFollowUp(sessionKey, text) {
  // Actions are messages, never mutations — the widget never calls a
  // mutating tool itself; it hands a prompt back to the assistant.
  window.openai?.sendFollowUpMessage?.({ prompt: `${text} (sessionKey: ${sessionKey})` });
}

function el(tag, props, children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props ?? {})) {
    if (k === "onclick") node.addEventListener("click", v);
    else if (k === "onkeydown") node.addEventListener("keydown", v);
    else if (k === "class") node.className = v;
    else node.setAttribute(k, v);
  }
  for (const child of children ?? []) {
    if (child === null || child === undefined) continue;
    node.append(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

function contentNode(className, value) {
  const node = el("div", { class: className }, []);
  const text = String(value ?? "");
  if (isLikelyMarkdown(text)) node.innerHTML = renderMarkdownHtml(text);
  else { node.classList.add("cc-plain"); node.textContent = text; }
  return node;
}

function renderRow(row, opts = {}) {
  const taskId = row.latestTask.taskId ?? row.latestTask.jobId;
  const pill = deriveStatusPill(row.group);
  const history = app.expanded.get(row.sessionKey);
  const historyOpen = app.historyOpen.has(row.sessionKey);
  const promptResolved = app.promptText.has(taskId);
  // The latest timeline item is the live evidence shown below the response.
  const latestEntry = taskId === app.timelineFor ? app.timeline[0] : undefined;

  const children = [
    el("div", { class: "cc-head" }, [
      el("div", { class: "cc-title" }, [row.title]),
      el("span", { class: `cc-pill cc-pill--${row.group}` }, [`${pill.icon} ${pill.label}`]),
    ]),
    el("div", { class: "cc-meta" }, [
      `${row.latestTask.agent ?? "?"} · ${deriveActivityLabel(row.latestTask, Date.now())}`,
    ]),
  ];

  if (app.cardTabFor !== taskId) {
    app.cardTabFor = taskId;
    app.cardTab = defaultCardTab(row.latestTask);
  }
  const cardTabs = deriveCardTabs(row.latestTask);
  const tabLabels = { response: "Response", diagnostics: "Diagnostics", request: "Request" };
  const tablistId = `cc-tabs-${String(taskId).replace(/[^a-zA-Z0-9_-]/g, "-")}`;
  children.push(
    el("div", { class: "cc-card-tabs", role: "tablist", "aria-label": "Task details", id: tablistId }, cardTabs.map((tab, index) =>
      el("button", {
        class: "cc-card-tab",
        role: "tab",
        id: `${tablistId}-${tab}`,
        "aria-selected": app.cardTab === tab ? "true" : "false",
        "aria-controls": `${tablistId}-panel`,
        tabindex: app.cardTab === tab ? "0" : "-1",
        onclick: (e) => { e.stopPropagation(); app.cardTab = tab; render(); },
        onkeydown: (e) => {
          const next = nextCardTab(cardTabs, app.cardTab, e.key);
          if (next !== app.cardTab) { e.preventDefault(); app.cardTab = next; render(); document.getElementById(`${tablistId}-${next}`)?.focus(); }
        },
      }, [tabLabels[tab]]),
    )),
  );

  const panelChildren = [];
  if (app.cardTab === "request") {
    if (promptResolved) {
      panelChildren.push(
        el("div", { class: "cc-prompt" }, [
          el("div", { class: "cc-prompt-head" }, ["Original request"]),
          contentNode("cc-prompt-body", app.promptText.get(taskId)),
        ]),
      );
    } else if (canReadPrompt(row.latestTask)) {
      panelChildren.push(el("div", { class: "cc-prompt cc-prompt-loading" }, ["Loading request…"]));
    }
  } else if (app.cardTab === "diagnostics") {
    const info = row.latestTask.error ?? row.latestTask.errorInfo?.message ?? row.latestTask.errorInfo?.category ?? "The task failed without additional diagnostics.";
    panelChildren.push(el("div", { class: "cc-diagnostics" }, [String(info)]));
  } else {
    if (row.latestTask.summary) {
      panelChildren.push(contentNode("cc-response", row.latestTask.summary));
    } else if (row.latestTask.status === "completed_no_summary") {
      panelChildren.push(contentNode("cc-response", "Finished - no response summary was returned."));
    } else if (row.latestTask.status === "running" || row.latestTask.status === "queued") {
      // The status pill and timeline are the explanation while a task runs.
      // Keep the response area quiet until there is an actual response.
      if (!latestEntry) panelChildren.push(el("span", { class: "cc-live-loading", role: "status", "aria-label": "Task is running" }, []));
    }
  }
  children.push(el("div", { role: "tabpanel", id: `${tablistId}-panel`, "aria-labelledby": `${tablistId}-${app.cardTab}` }, panelChildren));

  // The actual evidence behind "is working" — a real log line, not just a
  // status word. Only present for the one row currently in focus/highlighted
  // (refresh() only fetches it there — see the bounded-reads note in refresh()).
  if (latestEntry) {
    children.push(
      el("div", { class: "cc-update" }, [
        // Lifecycle/tool rows are evidence, not task status. Keep them
        // neutral unless the event itself carried an error bit.
        el("span", { class: "cc-update-icon" }, [latestEntry.isError ? "✕" : "•"]),
        el("span", {}, [latestEntry.count > 1 ? `${latestEntry.text} ×${latestEntry.count}` : latestEntry.text]),
      ]),
    );
  }

  // Compact counts by default ("1 running · 6 completed"); the itemized
  // list only once the user explicitly asks for it (click) — keeps the
  // inline card compact per the preserved design constraint.
  if (history && history.length > 0) {
    if (historyOpen) {
      children.push(
        el(
          "div",
          { class: "cc-history" },
          history.map((h) =>
            el("div", { class: "cc-history-item" }, [
              el("span", { class: `cc-dot cc-dot--${groupStatus(h.status)}` }, []),
              deriveTitle(h),
            ]),
          ),
        ),
      );
    } else {
      const counts = formatCounts(deriveCounts(history));
      if (counts) children.push(el("div", { class: "cc-counts" }, [counts]));
    }
  }

  const classes = opts.pinned ? "cc-row cc-row--pinned" : "cc-row";
  return el("div", { class: classes, onclick: () => toggleExpand(row.sessionKey) }, children);
}

function render() {
  const root = document.getElementById("root");
  root.innerHTML = "";
  root.className = app.displayMode === "fullscreen" ? "cc-fullscreen" : "";
  if (app.displayMode === "fullscreen") {
    renderFullscreen(root);
  } else {
    renderInline(root);
  }
  persist();
}

function renderInline(root) {
  const view = deriveViewMode(app.mounted, app.tasks);
  const pinnedSessionKey = view.highlightSessionKey ?? app.mounted?.sessionKey;
  const rows = buildSessionRows(ensurePinnedTask(app.tasks, app.pinnedDetail), { highlightSessionKey: pinnedSessionKey });
  // The pinned (focused/mounted) session always shows, finished or not —
  // a task completing is exactly when its result matters most. The Active
  // filter only ever declutters everything else.
  const visibleRows = filterRows(rows, app.view, pinnedSessionKey);

  if (visibleRows.length === 0) {
    if (app.tasks.length === 0) {
      root.append(el("div", { class: "cc-empty", role: "status" }, [
        el("span", { class: "cc-empty-icon", "aria-hidden": "true" }, ["○"]),
        el("div", {}, [
          el("div", { class: "cc-empty-title" }, ["No active tasks"]),
          el("div", { class: "cc-empty-copy" }, ["New delegated tasks will appear here while they run."]),
        ]),
      ]));
    } else {
      root.append(el("div", { class: "cc-empty", role: "status" }, [
        el("span", { class: "cc-empty-icon", "aria-hidden": "true" }, ["○"]),
        el("div", {}, [
          el("div", { class: "cc-empty-title" }, ["Nothing needs attention"]),
          el("div", { class: "cc-empty-copy" }, ["Switch to Recent to view completed tasks."]),
        ]),
      ]));
    }
  } else {
    for (const row of visibleRows) root.append(renderRow(row, { pinned: row.sessionKey === pinnedSessionKey }));
  }

  if (app.displayModeNote) {
    root.append(el("div", { class: "cc-note" }, [app.displayModeNote]));
  }

  const toolbarChildren = [];
  // Feature-detected, not assumed — see requestDisplayMode's doc comment.
  // Absent entirely (not disabled/greyed) when the host gives no signal it
  // implements display-mode requests at all.
  if (bridge.supportsDisplayModeRequest()) {
    toolbarChildren.push(
      el("button", {
        class: "cc-btn cc-control",
        title: "Open Task Center",
        "aria-label": "Open Task Center",
        onclick: openTaskCenter,
      }, [el("span", { class: "cc-control-icon", "aria-hidden": "true" }, ["⛶"])]),
    );
  }
  // Global controls stay above the card so they don't read as actions on the
  // task below. Labels remain visible at compact size; title/aria-labels make
  // the icon mapping discoverable to hover and assistive-tech users.
  root.insertBefore(el("div", { class: "cc-toolbar" }, toolbarChildren), root.firstChild);
}

function renderFullscreen(root) {
  const rows = buildSessionRows(ensurePinnedTask(app.tasks, app.pinnedDetail), { highlightSessionKey: app.selectedSessionKey });
  const visibleRows = filterRows(rows, app.view, app.selectedSessionKey);

  const header = el("div", { class: "cc-fs-header" }, [
    el("div", { class: "cc-fs-title" }, ["Task Center"]),
    el("button", { class: "cc-btn", onclick: closeTaskCenter }, ["Close"]),
  ]);

  const sidebar = el(
    "div",
    { class: "cc-fs-sidebar" },
    [
      ...(visibleRows.length === 0
        ? [el("div", { class: "cc-meta" }, ["Nothing here yet."])]
        : visibleRows.map((row) => {
            const selected = row.sessionKey === app.selectedSessionKey;
            const pill = deriveStatusPill(row.group);
            return el(
              "div",
              {
                class: `cc-fs-session${selected ? " cc-fs-session--selected" : ""}`,
                onclick: () => {
                  app.selectedSessionKey = row.sessionKey;
                  app.selectedTaskId = null;
                  app.detailTab = "overview";
                  refresh();
                },
              },
              [
                el("div", { class: "cc-title" }, [row.title]),
                el("div", { class: "cc-meta" }, [`${pill.icon} ${row.latestTask.agent ?? "?"} · ${deriveActivityLabel(row.latestTask, Date.now())}`]),
              ],
            );
          })),
    ],
  );

  const selectedSessionKey = app.selectedSessionKey;
  const history = selectedSessionKey ? app.expanded.get(selectedSessionKey) : undefined;
  const selectedSummary = history?.find((t) => (t.taskId ?? t.jobId) === app.selectedTaskId) ?? history?.[0];
  // get_session(mode:"tasks") also returns plain TaskSummary (no
  // artifacts) — swap in the full snapshot when the selection matches the
  // one pinned/detail-fetched task, same as mergePinnedDetail() does for rows.
  const selectedTask = selectedSummary ? mergePinnedDetail([selectedSummary], app.pinnedDetail)[0] : selectedSummary;

  const taskList = el(
    "div",
    { class: "cc-fs-tasklist" },
    !selectedSessionKey
      ? [el("div", { class: "cc-meta" }, ["Select a session."])]
      : !history
        ? [el("div", { class: "cc-meta" }, ["Loading…"])]
        : history.length === 0
          ? [el("div", { class: "cc-meta" }, ["No tasks in this session yet."])]
          : history.map((t) => {
              const tid = t.taskId ?? t.jobId;
              const selected = Boolean(selectedTask) && tid === (selectedTask.taskId ?? selectedTask.jobId);
              return el(
                "div",
                {
                  class: `cc-fs-task${selected ? " cc-fs-task--selected" : ""}`,
                  onclick: () => { app.selectedTaskId = tid; app.detailTab = "overview"; refresh(); },
                },
                [el("span", { class: `cc-dot cc-dot--${groupStatus(t.status)}` }, []), deriveTitle(t)],
              );
            }),
  );

  const main = el("div", { class: "cc-fs-main" }, [taskList, renderDetailPane(selectedTask)]);
  root.append(header, el("div", { class: "cc-fs-body" }, [sidebar, main]));
}

function renderDetailPane(task) {
  if (!task) {
    return el("div", { class: "cc-fs-detail" }, [el("div", { class: "cc-meta" }, ["Select a task to see its details."])]);
  }
  const taskId = task.taskId ?? task.jobId;
  const tabs = deriveDetailTabs(task);
  if (!tabs.includes(app.detailTab)) app.detailTab = "overview";
  const tabLabels = { overview: "Overview", artifacts: "Artifacts", prompt: "Original prompt" };

  const tabButtons = tabs.map((tab) =>
    el(
      "button",
      { class: `cc-btn${app.detailTab === tab ? " cc-btn--primary" : ""}`, onclick: () => { app.detailTab = tab; render(); } },
      [tabLabels[tab]],
    ),
  );

  const body = [];
  if (app.detailTab === "overview") {
    const pill = deriveStatusPill(groupStatus(task.status));
    body.push(el("span", { class: `cc-pill cc-pill--${groupStatus(task.status)}` }, [`${pill.icon} ${pill.label}`]));
    body.push(el("div", { class: "cc-meta" }, [`${task.agent ?? "?"} · ${deriveActivityLabel(task, Date.now())}`]));
    // Same evidence as the inline card's update line, from the same
    // bounded per-selection fetch in refresh() — not a separate concept.
    if (taskId === app.timelineFor && app.timeline.length > 0) {
      body.push(
        el(
          "div",
          { class: "cc-history" },
          app.timeline.map((entry) =>
            el("div", { class: "cc-history-item" }, [entry.count > 1 ? `${entry.text} ×${entry.count}` : entry.text]),
          ),
        ),
      );
    }
    if (task.summary) body.push(contentNode("cc-response", task.summary));
    if (task.error) body.push(el("div", {}, [`Error: ${task.error}`]));
  } else if (app.detailTab === "artifacts") {
    const a = task.artifacts ?? {};
    if (a.prUrl) body.push(el("div", {}, [`Pull request: ${a.prUrl}`]));
    if (a.branchName) body.push(el("div", {}, [`Branch: ${a.branchName}`]));
    if (a.commitSha) body.push(el("div", {}, [`Commit: ${a.commitSha}`]));
    if (a.filesChanged?.length) body.push(el("div", {}, [`Files changed: ${a.filesChanged.join(", ")}`]));
    if (a.commandsRun?.length) body.push(el("div", {}, [`Commands run: ${a.commandsRun.length}`]));
  } else if (app.detailTab === "prompt") {
    if (app.promptText.has(taskId)) {
      body.push(contentNode("cc-prompt-body", app.promptText.get(taskId)));
    } else {
      body.push(el("div", { class: "cc-prompt-loading" }, ["Loading request…"]));
    }
  }

  return el("div", { class: "cc-fs-detail" }, [
    el("div", { class: "cc-title" }, [deriveTitle(task)]),
    el("div", { class: "cc-fs-tabs" }, tabButtons),
    el("div", { class: "cc-fs-detail-body" }, body),
  ]);
}

rehydrate();
render();
refresh();
</script>
</body>
</html>
